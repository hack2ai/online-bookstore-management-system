name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Package application
        run: mvn -B -DskipTests package

      - name: Verify production artifact
        run: test -f target/bookstore.jar

      - name: Build Docker image
        run: docker build --tag bookstore:ci .

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    env:
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for application health
        run: |
          for i in {1..60}; do
            if curl -fsS --max-time 5 http://localhost:8080/actuator/health; then
              echo
              echo "Application is healthy."
              exit 0
            fi

            echo "Waiting for application... attempt ${i}/60"
            docker compose ps
            sleep 5
          done

          echo "Application did not become healthy."
          docker compose ps
          docker compose logs --no-color app --tail=300
          docker compose logs --no-color mysql --tail=150
          exit 1

      - name: Verify storefront
        run: curl -fsS --max-time 10 http://localhost:8080/ > /dev/null

      - name: Verify container status
        run: docker compose ps

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v
