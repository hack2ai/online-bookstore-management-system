services:
  mysql:
    image: mysql:8.4
    container_name: bookstore-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bookstore_db
      MYSQL_USER: ${DB_USERNAME:-bookstore}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bookstore}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/seed-demo.sql:/docker-entrypoint-initdb.d/02-seed-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-bookstore} -p${MYSQL_PASSWORD:-bookstore} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: bookstore-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PAYMENT_MODE: ${PAYMENT_MODE:-RAZORPAY}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bookstore_db
      DB_USERNAME: ${DB_USERNAME:-bookstore}
      DB_PASSWORD: ${DB_PASSWORD:-bookstore}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
