# ===================================================================
# Test profile - H2 in-memory database.
# Activated automatically by Spring Boot's test slice annotations / @ActiveProfiles("test").
# This lets CI and local `mvn test` runs work without a live MySQL instance.
# It is NOT used in dev or prod - those use real MySQL (see application.properties).
# ===================================================================

spring.datasource.url=jdbc:h2:mem:bookstore_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Skip schema.sql and Flyway (both are written for the production MySQL schema).
spring.sql.init.mode=never
spring.flyway.enabled=false

# Base64-encoded test-only JWT material; never reuse in development or production.
app.jwt.secret=VGhpc0lzQVRlc3RPbmx5SldUU2VjcmV0Rm9ySW50ZWdyYXRpb25UZXN0cw==
razorpay.key-id=rzp_test_dummy
razorpay.key-secret=dummy_secret
payment.mode=MOCK
