# ===================================================================
# Test profile - H2 in-memory database.
# Activated automatically by Spring Boot's test slice annotations / @ActiveProfiles("test").
# This lets CI and local `mvn test` runs work without a live MySQL instance.
# It is NOT used in dev or prod - those use real MySQL (see application.properties).
# ===================================================================

spring.datasource.url=jdbc:h2:mem:bookstore_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Skip schema.sql (written for MySQL syntax) during tests; ddl-auto=create-drop
# generates the H2 schema directly from the JPA entity mappings instead.
spring.sql.init.mode=never

app.jwt.secret=test-only-secret-key-not-for-any-real-use-padding-to-satisfy-hs256-minimum-length-0000
razorpay.key-id=rzp_test_dummy
razorpay.key-secret=dummy_secret
