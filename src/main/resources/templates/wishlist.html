<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wishlist — Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#f7f7f4;color:#172033;font-family:Inter,system-ui,sans-serif}
        .navbar{background:#fff;border-bottom:1px solid #ecebe7}
        .brand{font-weight:800;letter-spacing:-.04em}
        .card{border:1px solid #e8e6e1;border-radius:20px}
        .cover{height:170px;background:linear-gradient(145deg,#e8e1d8,#c8d2df);display:flex;align-items:center;justify-content:center}
        .muted{color:#6b7280}
        .accent{background:#e07a5f;color:#fff;border:0}
        .accent:hover{background:#ca654d;color:#fff}
        .book-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3rem}
        .book-card{transition:transform .18s ease,box-shadow .18s ease}
        .book-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(23,32,51,.08)!important}
    </style>
</head>
<body>
<nav class="navbar">
    <div class="container py-3 d-flex justify-content-between align-items-center">
        <a class="navbar-brand brand" href="/">BOOKSTORE<span style="color:#e07a5f">.</span></a>
        <div class="d-flex gap-2">
            <a class="btn btn-sm btn-outline-dark rounded-pill" href="/account"><i class="bi bi-person me-1"></i>Account</a>
            <a class="btn btn-sm btn-outline-dark rounded-pill" href="/cart"><i class="bi bi-cart3 me-1"></i>Cart</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
        <div>
            <div class="text-secondary text-uppercase small fw-bold">Saved for later</div>
            <h1 class="fw-bold mb-1">My Wishlist</h1>
            <p class="muted mb-0">Keep books you want to come back to.</p>
        </div>
        <a href="/" class="btn btn-outline-dark rounded-pill"><i class="bi bi-arrow-left me-1"></i>Continue shopping</a>
    </div>

    <div class="text-center py-5" th:if="${items.empty}">
        <div class="mb-3" aria-hidden="true"><i class="bi bi-heart fs-1 muted"></i></div>
        <h3 class="fw-bold">Your wishlist is empty</h3>
        <p class="muted">Save a book from its details page and find it here later.</p>
        <a href="/" class="btn accent rounded-pill"><i class="bi bi-search me-1"></i>Browse books</a>
    </div>

    <div class="row g-4" th:unless="${items.empty}">
        <div class="col-sm-6 col-lg-4" th:each="item : ${items}">
            <article class="card book-card overflow-hidden h-100 shadow-sm">
                <div class="cover" aria-hidden="true"><i class="bi bi-book" style="font-size:4rem;opacity:.45"></i></div>
                <div class="p-4 d-flex flex-column h-100">
                    <div class="text-secondary small mb-1" th:text="${item.author}">Author</div>
                    <h5 class="fw-bold book-title" th:text="${item.title}">Book title</h5>
                    <div class="fs-5 fw-bold mt-2 mb-3" th:text="${'₹' + item.price}">₹0</div>
                    <div class="mt-auto d-flex flex-wrap gap-2">
                        <a class="btn btn-sm accent rounded-pill" th:href="@{'/books/' + ${item.bookId}}"><i class="bi bi-eye me-1"></i>View book</a>
                        <form method="post" th:action="@{'/wishlist/' + ${item.bookId} + '/remove'}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-danger rounded-pill" type="submit"><i class="bi bi-heartbreak me-1"></i>Remove</button>
                        </form>
                    </div>
                </div>
            </article>
        </div>
    </div>
</main>
</body>
</html>
