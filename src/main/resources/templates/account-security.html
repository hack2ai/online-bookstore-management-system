<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Security — Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f7f7f4;color:#172033;font-family:Inter,system-ui,sans-serif}.navbar{background:#fff;border-bottom:1px solid #ecebe7}.brand{font-weight:800;letter-spacing:-.04em}.panel{background:#fff;border:1px solid #e8e6e1;border-radius:22px}.muted{color:#6b7280}.accent{background:#e07a5f;color:#fff;border:0}.accent:hover{background:#ca654d;color:#fff}</style>
</head>
<body>
<nav class="navbar"><div class="container py-3 d-flex justify-content-between align-items-center"><a class="navbar-brand brand" href="/">BOOKSTORE<span style="color:#e07a5f">.</span></a><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-dark rounded-pill" href="/account">My Account</a><form method="post" action="/auth/logout" class="d-inline"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-light border rounded-pill">Logout</button></form></div></div></nav>
<main class="container py-5" style="max-width:850px">
    <div class="mb-4"><div class="text-secondary text-uppercase small fw-bold">Account settings</div><h1 class="fw-bold mb-1">Security</h1><p class="muted mb-0">Change your password without exposing your current credentials.</p></div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}">Password changed successfully.</div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Could not change password.</div>
    <div class="panel p-4">
        <form method="post" action="/account/security" autocomplete="off">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3"><label class="form-label fw-semibold">Current password</label><input class="form-control" type="password" name="currentPassword" autocomplete="current-password" required></div>
            <div class="mb-3"><label class="form-label fw-semibold">New password</label><input class="form-control" type="password" name="newPassword" minlength="8" maxlength="72" autocomplete="new-password" required><div class="form-text">Use 8–72 characters.</div></div>
            <div class="mb-4"><label class="form-label fw-semibold">Confirm new password</label><input class="form-control" type="password" name="confirmPassword" minlength="8" maxlength="72" autocomplete="new-password" required></div>
            <div class="d-flex gap-2"><button class="btn accent rounded-pill px-4">Change password</button><a class="btn btn-outline-dark rounded-pill" href="/account">Cancel</a></div>
        </form>
    </div>
</main>
</body>
</html>
