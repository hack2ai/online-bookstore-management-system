<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${book.title + ' — Bookstore'}">Book — Bookstore</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><style>body{background:#f7f7f4;color:#172033;font-family:Inter,system-ui,sans-serif}.navbar{background:#fff;border-bottom:1px solid #ecebe7}.brand{font-weight:800;letter-spacing:-.04em}.panel{background:#fff;border:1px solid #e8e6e1;border-radius:24px}.cover{min-height:500px;border-radius:20px;background:linear-gradient(145deg,#e8e1d8,#c8d2df);display:flex;align-items:center;justify-content:center}.cover i{font-size:8rem;opacity:.35}.price{font-size:2rem;font-weight:800}.muted{color:#6b7280}.accent{background:#e07a5f;color:#fff;border:0}.accent:hover{background:#ca654d;color:#fff}</style></head>
<body><nav class="navbar"><div class="container py-3"><a class="navbar-brand brand" href="/">BOOKSTORE<span style="color:#e07a5f">.</span></a><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-dark rounded-pill" href="/books">Books</a><a class="btn btn-sm btn-outline-dark rounded-pill" href="/cart"><i class="bi bi-bag"></i> Cart</a></div></div></nav>
<main class="container py-5"><div class="panel p-3 p-lg-5"><div class="row g-5 align-items-center"><div class="col-lg-5"><div class="cover"><i class="bi bi-book-half"></i></div></div><div class="col-lg-7"><span class="badge rounded-pill text-bg-light mb-3" th:text="${book.categoryName ?: 'Book'}">Category</span><h1 class="display-5 fw-bold" th:text="${book.title}">Book title</h1><p class="lead muted mb-1" th:text="${'by ' + book.author}">by Author</p><p class="small muted" th:text="${'ISBN: ' + book.isbn}">ISBN</p><div class="price my-4" th:text="${'₹' + book.price}">₹0</div><p class="muted" th:text="${book.description ?: 'A great addition to your reading list.'}">Description</p><div class="d-flex gap-2 align-items-center my-4"><span class="badge rounded-pill" th:classappend="${book.inStock ? 'text-bg-success' : 'text-bg-secondary'}" th:text="${book.inStock ? 'In stock' : 'Out of stock'}">In stock</span><span class="small muted" th:text="${book.inStock ? book.stock + ' available' : 'Currently unavailable'}">Available</span></div><form th:if="${book.inStock}" action="/cart/items" method="post" class="d-flex gap-2"><input type="hidden" name="bookId" th:value="${book.id}"><input type="number" name="quantity" value="1" min="1" max="100" class="form-control rounded-pill" style="max-width:110px"><button class="btn accent rounded-pill px-4" type="submit"><i class="bi bi-bag-plus me-1"></i> Add to cart</button></form><button class="btn btn-secondary rounded-pill px-4" disabled th:unless="${book.inStock}">Out of stock</button></div></div></div></div></main></body></html>
