<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root{--ink:#172033;--line:#e8e6e1;--soft:#f7f7f4;--accent:#e07a5f;--accent-dark:#ca654d}
        body{background:var(--soft);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
        .navbar{background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:-.04em}
        .panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 35px rgba(23,32,51,.07)}
        .error-icon{width:84px;height:84px;border-radius:24px;background:#eef1f5;display:inline-flex;align-items:center;justify-content:center;font-size:2.2rem;color:#4b5563}
        .code{font-size:.8rem;letter-spacing:.14em}.accent{background:var(--accent);color:#fff;border:0}.accent:hover{background:var(--accent-dark);color:#fff}.muted{color:#6b7280}
    </style>
</head>
<body>
<nav class="navbar"><div class="container py-3 d-flex justify-content-between align-items-center"><a class="text-decoration-none text-dark brand" href="/">BOOKSTORE<span style="color:#e07a5f">.</span></a><div class="d-flex gap-2"><a href="/books" class="btn btn-sm btn-outline-dark rounded-pill"><i class="bi bi-book me-1"></i>Browse books</a><a href="/" class="btn btn-sm btn-outline-dark rounded-pill"><i class="bi bi-house me-1"></i>Home</a></div></div></nav>
<main class="container py-5 flex-grow-1 d-flex align-items-center"><div class="row justify-content-center w-100"><div class="col-lg-7 col-xl-6">
    <div class="panel p-4 p-md-5 text-center">
        <div class="error-icon mx-auto mb-4" aria-hidden="true"><i class="bi bi-search"></i></div>
        <div class="code text-uppercase fw-bold text-secondary">404 · Page not found</div>
        <h1 class="display-6 fw-bold mt-2">We couldn't find that page.</h1>
        <p class="muted mb-4">The page may have moved, expired, or never existed. Try browsing the catalog or return to the storefront.</p>
        <div class="d-flex justify-content-center flex-wrap gap-2">
            <a class="btn accent rounded-pill px-4" href="/"><i class="bi bi-arrow-left me-1"></i>Back to storefront</a>
            <a class="btn btn-outline-dark rounded-pill px-4" href="/books"><i class="bi bi-book me-1"></i>Browse books</a>
        </div>
    </div>
</div></div></main>
</body>
</html>
