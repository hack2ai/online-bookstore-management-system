<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access denied — Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f7f7f4;color:#172033;font-family:Inter,system-ui,sans-serif;min-height:100vh}
        .panel{background:#fff;border:1px solid #e8e6e1;border-radius:24px}
        .accent{background:#e07a5f;color:#fff;border:0}.accent:hover{background:#ca654d;color:#fff}
    </style>
</head>
<body>
<nav class="border-bottom bg-white"><div class="container py-3"><a class="text-decoration-none fw-bold text-dark" href="/">BOOKSTORE<span style="color:#e07a5f">.</span></a></div></nav>
<main class="container py-5">
    <div class="row justify-content-center"><div class="col-lg-7">
        <div class="panel p-5 text-center">
            <div class="text-secondary text-uppercase small fw-bold">403</div>
            <h1 class="fw-bold mt-2">You don't have access to this page.</h1>
            <p class="text-secondary mb-4">Your account is signed in, but it doesn't have the required permission.</p>
            <div class="d-flex justify-content-center flex-wrap gap-2">
                <a class="btn accent rounded-pill px-4" href="/">Back to storefront</a>
                <a class="btn btn-outline-dark rounded-pill px-4" href="/auth/login">Sign in differently</a>
            </div>
        </div>
    </div></div>
</main>
</body>
</html>
