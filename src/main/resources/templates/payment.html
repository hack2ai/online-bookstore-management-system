<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay for order — Bookstore</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body style="background:#f7f7f4;color:#172033"><main class="container py-5"><div class="card border-0 shadow-sm rounded-4 p-4 p-lg-5 mx-auto" style="max-width:700px"><h1 class="fw-bold">Complete your payment</h1><p class="text-secondary">Order <strong th:text="${' #' + order.id}">#1</strong></p><div class="d-flex justify-content-between border-top border-bottom py-3 my-3"><span>Total</span><strong th:text="${'₹' + order.totalAmount}">₹0</strong></div><button id="pay-button" class="btn btn-dark rounded-pill px-4 w-100">Pay securely with Razorpay</button><div id="error" class="alert alert-danger mt-3 d-none"></div></div></main><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script th:inline="javascript">const orderId=/*[[${order.id}]]*/0;const amount=/*[[${order.totalAmount}]]*/0;const keyId=/*[[${razorpayKeyId}]]*/'';document.getElementById('pay-button').addEventListener('click',async()=>{const button=document.getElementById('pay-button');button.disabled=true;try{const create=await fetch('/api/payments/orders/'+orderId,{method:'POST',headers:{'Content-Type':'application/json'}});if(!create.ok)throw new Error('Could not create payment.');const payment=await create.json();const data=payment.data||payment;const options={key:keyId,amount:Math.round(Number(amount)*100),currency:'INR',name:'Bookstore',description:'Order #'+orderId,order_id:data.razorpayOrderId,prefill:{},handler:async function(response){const verify=await fetch('/api/payments/orders/'+orderId+'/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({razorpayOrderId:response.razorpay_order_id,razorpayPaymentId:response.razorpay_payment_id,razorpaySignature:response.razorpay_signature})});if(!verify.ok)throw new Error('Payment verification failed.');window.location='/orders/'+orderId;},modal:{ondismiss:()=>{button.disabled=false;}}};new Razorpay(options).open();}catch(e){document.getElementById('error').textContent=e.message;document.getElementById('error').classList.remove('d-none');button.disabled=false;}});</script></body></html>
