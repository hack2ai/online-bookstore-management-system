<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${'Pay Order #' + order.id + ' — Bookstore'}">Pay — Bookstore</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f7f7f4;color:#172033;font-family:Inter,system-ui,sans-serif}.panel{background:#fff;border:1px solid #e8e6e1;border-radius:22px}.accent{background:#e07a5f;color:#fff;border:0}.price{font-weight:800}</style>
</head>
<body>
<nav class="navbar bg-white border-bottom"><div class="container py-3"><a class="navbar-brand fw-bold text-dark text-decoration-none" href="/">BOOKSTORE<span style="color:#e07a5f">.</span></a><a href="/orders" class="btn btn-sm btn-outline-dark rounded-pill">Back to orders</a></div></nav>
<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><div class="panel p-4 p-lg-5">
<div class="text-secondary small text-uppercase fw-bold">Secure checkout</div><h1 class="fw-bold mt-1" th:text="${'Order #' + order.id}">Order #1</h1><p class="text-secondary">Complete payment for your bookstore order.</p>
<div class="d-flex justify-content-between align-items-center border-top border-bottom py-4 my-4"><span>Total</span><span class="price fs-3" th:text="${'₹' + order.totalAmount}">₹0</span></div>
<div id="paymentError" class="alert alert-danger d-none"></div><div id="paymentReady" class="alert alert-success d-none">Payment verified successfully. Redirecting to your order...</div>
<button id="payButton" type="button" class="btn accent rounded-pill px-4 w-100 py-3">Pay securely with Razorpay</button>
<a href="/orders" class="btn btn-outline-dark rounded-pill px-4 w-100 py-3 mt-2">Back to orders</a>
</div></div></div></main>
<script th:inline="javascript">
const razorpayKeyId=/*[[${razorpayKeyId}]]*/'';const razorpayOrderId=/*[[${payment.razorpayOrderId}]]*/'';const orderId=/*[[${order.id}]]*/0;const totalAmount=/*[[${order.totalAmount}]]*/0;const csrfToken=/*[[${_csrf.token}]]*/'';const errorBox=document.getElementById('paymentError');const readyBox=document.getElementById('paymentReady');const button=document.getElementById('payButton');
function showError(message){errorBox.textContent=message||'Payment could not be completed. Please try again.';errorBox.classList.remove('d-none');}
button.addEventListener('click',function(){errorBox.classList.add('d-none');if(!razorpayKeyId||!razorpayOrderId){showError('Razorpay is not configured. Set RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET before taking payments.');return;}const options={key:razorpayKeyId,amount:Math.round(Number(totalAmount)*100),currency:'INR',name:'Bookstore',description:'Order #'+orderId,order_id:razorpayOrderId,handler:async function(response){button.disabled=true;try{const result=await fetch('/api/payments/orders/'+orderId+'/verify',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-TOKEN':csrfToken},body:JSON.stringify({razorpayOrderId:response.razorpay_order_id,razorpayPaymentId:response.razorpay_payment_id,razorpaySignature:response.razorpay_signature})});const body=await result.json();if(!result.ok||!body.success)throw new Error(body.message||'Payment verification failed.');readyBox.classList.remove('d-none');setTimeout(()=>window.location.href='/orders/'+orderId,800);}catch(error){button.disabled=false;showError(error.message);}},modal:{ondismiss:function(){button.disabled=false}}};const razorpay=new Razorpay(options);razorpay.on('payment.failed',function(response){button.disabled=false;showError(response.error&&response.error.description?response.error.description:'Payment failed.');});razorpay.open();});
</script>
</body></html>
