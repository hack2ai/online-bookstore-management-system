<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${'Order #' + order.id + ' — Bookstore'}">Order — Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#f7f7f4;color:#172033;font-family:Inter,system-ui,sans-serif}
        .navbar{background:#fff;border-bottom:1px solid #ecebe7}
        .panel{background:#fff;border:1px solid #e8e6e1;border-radius:20px;box-shadow:0 4px 20px rgba(23,32,51,.05)}
        .muted{color:#6b7280}
        .status{display:inline-flex;align-items:center;gap:.35rem;padding:.45rem .75rem;border-radius:999px;font-size:.8rem;font-weight:700}
        .status-pending{background:#fff3cd;color:#8a6500}
        .status-confirmed{background:#cff4fc;color:#055160}
        .status-shipped{background:#e2d9f3;color:#4b2c77}
        .status-delivered{background:#d1e7dd;color:#0f5132}
        .status-cancelled{background:#f8d7da;color:#842029}
        .price{font-weight:800}
        .item-row:last-child{border-bottom:0!important}
    </style>
</head>
<body>
<nav class="navbar">
    <div class="container py-3 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
        <a class="navbar-brand fw-bold text-dark text-decoration-none" href="/">BOOKSTORE<span style="color:#e07a5f">.</span></a>
        <div class="d-flex flex-wrap gap-2">
            <a href="/orders" class="btn btn-sm btn-outline-dark rounded-pill"><i class="bi bi-arrow-left me-1"></i>Back to orders</a>
            <a href="/books" class="btn btn-sm btn-dark rounded-pill"><i class="bi bi-bag me-1"></i>Continue shopping</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div th:if="${success}" class="alert alert-success d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${success}">Order cancelled successfully.</span>
    </div>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
        <div>
            <div class="text-secondary small text-uppercase fw-bold">Order details</div>
            <h1 class="fw-bold mb-1" th:text="${'Order #' + order.id}">Order #1</h1>
            <div class="muted" th:text="${#temporals.format(order.orderDate,'dd MMM yyyy, HH:mm')}">Date</div>
        </div>
        <div class="text-md-end">
            <span class="status"
                  th:classappend="${order.status.name() == 'PENDING' ? ' status-pending' : (order.status.name() == 'CONFIRMED' ? ' status-confirmed' : (order.status.name() == 'SHIPPED' ? ' status-shipped' : (order.status.name() == 'DELIVERED' ? ' status-delivered' : ' status-cancelled')))}"
                  th:text="${order.status}">PENDING</span>
            <div class="small muted mt-2" th:if="${order.paymentStatus}" th:text="${'Payment: ' + order.paymentStatus}">Payment: CREATED</div>
            <div class="d-flex flex-wrap justify-content-md-end gap-2 mt-2">
                <a th:if="${(order.status.name() == 'PENDING' || order.status.name() == 'CONFIRMED') && order.paymentStatus?.name() != 'SUCCESS'}"
                   th:href="@{/orders/{id}/payment(id=${order.id})}"
                   class="btn btn-sm btn-dark rounded-pill"><i class="bi bi-credit-card me-1"></i>Pay now</a>
                <form th:if="${order.status.name() == 'PENDING' || order.status.name() == 'CONFIRMED'}"
                      th:action="@{'/orders/' + ${order.id} + '/cancel'}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill" onclick="return confirm('Cancel this order?');">
                        <i class="bi bi-x-circle me-1"></i>Cancel order
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="panel p-4 h-100">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="fw-bold mb-0">Items</h5>
                    <span class="small muted" th:text="${order.items.size() + (order.items.size() == 1 ? ' item' : ' items')}">1 item</span>
                </div>
                <div th:each="item : ${order.items}" class="item-row d-flex justify-content-between gap-3 py-3 border-bottom">
                    <div>
                        <div class="fw-semibold" th:text="${item.title}">Book title</div>
                        <div class="muted small" th:text="${'₹' + item.unitPrice + ' × ' + item.quantity}">₹0 × 1</div>
                    </div>
                    <div class="price text-nowrap" th:text="${'₹' + item.subtotal}">₹0</div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="panel p-4">
                <h5 class="fw-bold mb-3">Summary</h5>
                <div class="d-flex justify-content-between"><span>Subtotal</span><strong th:text="${'₹' + order.subtotalAmount}">₹0</strong></div>
                <div class="d-flex justify-content-between mt-2"><span>Discount</span><strong th:text="${'₹' + order.discountAmount}">₹0</strong></div>
                <hr>
                <div class="d-flex justify-content-between"><strong>Total</strong><strong class="price" th:text="${'₹' + order.totalAmount}">₹0</strong></div>

                <div class="border-top mt-4 pt-4">
                    <div class="text-secondary small fw-semibold"><i class="bi bi-geo-alt me-1"></i>Shipping address</div>
                    <div class="mt-1 lh-lg" th:text="${order.shippingAddress}">Address</div>
                </div>

                <div class="border-top mt-4 pt-4" th:if="${order.couponCode}">
                    <div class="text-secondary small fw-semibold"><i class="bi bi-ticket-perforated me-1"></i>Coupon</div>
                    <div class="mt-1 fw-semibold" th:text="${order.couponCode}">COUPON</div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
