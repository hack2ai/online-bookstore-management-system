<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${'Order #' + order.id + ' — Bookstore'}">Order — Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f7f7f4;color:#172033;font-family:Inter,system-ui,sans-serif}.navbar{background:#fff;border-bottom:1px solid #ecebe7}.panel{background:#fff;border:1px solid #e8e6e1;border-radius:20px}.status{font-size:.85rem;font-weight:700}.price{font-weight:800}</style>
</head>
<body>
<nav class="navbar"><div class="container py-3"><a class="navbar-brand fw-bold text-dark text-decoration-none" href="/">BOOKSTORE<span style="color:#e07a5f">.</span></a><div class="d-flex gap-2"><a href="/orders" class="btn btn-sm btn-outline-dark rounded-pill">Back to orders</a><a href="/books" class="btn btn-sm btn-dark rounded-pill">Continue shopping</a></div></div></nav>
<main class="container py-5">
<div th:if="${success}" class="alert alert-success" th:text="${success}">Order cancelled successfully.</div>
<div class="d-flex justify-content-between align-items-end mb-4"><div><div class="text-secondary small text-uppercase fw-bold">Order details</div><h1 class="fw-bold mb-1" th:text="${'Order #' + order.id}">Order #1</h1><div class="text-secondary" th:text="${order.orderDate}">Date</div></div><div class="text-end"><span class="badge rounded-pill text-bg-light status" th:text="${order.status}">PENDING</span><div class="d-flex flex-column align-items-end gap-2 mt-2"><a th:if="${order.status.name() == 'PENDING' || order.status.name() == 'CONFIRMED'}" th:href="@{/orders/{id}/pay(id=${order.id})}" class="btn btn-sm btn-dark rounded-pill">Pay now</a><form th:if="${order.status.name() == 'PENDING' || order.status.name() == 'CONFIRMED'}" th:action="@{'/orders/' + ${order.id} + '/cancel'}" method="post"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button type="submit" class="btn btn-sm btn-outline-danger rounded-pill" onclick="return confirm('Cancel this order?');">Cancel order</button></form></div></div></div>
<div class="row g-4"><div class="col-lg-8"><div class="panel p-4"><h5 class="fw-bold mb-3">Items</h5><div th:each="item : ${order.items}" class="d-flex justify-content-between gap-3 py-3 border-bottom"><div><div class="fw-semibold" th:text="${item.title}">Book title</div><div class="text-secondary small" th:text="${'₹' + item.unitPrice + ' × ' + item.quantity}">₹0 × 1</div></div><div class="price" th:text="${'₹' + item.subtotal}">₹0</div></div></div></div>
<div class="col-lg-4"><div class="panel p-4"><h5 class="fw-bold mb-3">Summary</h5><div class="d-flex justify-content-between"><span>Subtotal</span><strong th:text="${'₹' + order.subtotalAmount}">₹0</strong></div><div class="d-flex justify-content-between mt-2"><span>Discount</span><strong th:text="${'₹' + order.discountAmount}">₹0</strong></div><hr><div class="d-flex justify-content-between"><strong>Total</strong><strong class="price" th:text="${'₹' + order.totalAmount}">₹0</strong></div><div class="mt-4"><div class="text-secondary small fw-semibold">Shipping address</div><div class="mt-1" th:text="${order.shippingAddress}">Address</div></div><div class="mt-3" th:if="${order.couponCode}"><div class="text-secondary small fw-semibold">Coupon</div><div class="mt-1" th:text="${order.couponCode}">COUPON</div></div></div></div></div>
</main>
</body></html>
