<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders — Bookstore</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body style="background:#f7f7f4;color:#172033"><nav class="navbar bg-white border-bottom"><div class="container py-3"><a class="navbar-brand fw-bold" href="/">BOOKSTORE<span style="color:#e07a5f">.</span></a><a href="/books" class="btn btn-sm btn-dark rounded-pill">Continue shopping</a></div></nav><main class="container py-5"><h1 class="fw-bold mb-4">My orders</h1><div th:if="${orders.empty}" class="text-center py-5"><h4>No orders yet</h4><p class="text-secondary">Your next great read is waiting.</p><a href="/books" class="btn btn-dark rounded-pill">Browse books</a></div><div th:unless="${orders.empty}" class="row g-3"><div class="col-12" th:each="order : ${orders}"><div class="card border-0 shadow-sm rounded-4 p-4"><div class="d-flex justify-content-between flex-wrap gap-2"><div><strong th:text="${'Order #' + order.id}">Order #1</strong><div class="text-secondary small" th:text="${order.orderDate}">Date</div></div><div class="text-end"><span class="badge rounded-pill text-bg-light" th:text="${order.status}">PENDING</span><div class="small text-secondary mt-1" th:if="${order.paymentStatus}" th:text="${'Payment: ' + order.paymentStatus}">Payment: CREATED</div></div></div><div class="d-flex justify-content-between mt-3"><span th:text="${order.items.size() + ' item(s)'}">1 item</span><strong th:text="${'₹' + order.totalAmount}">₹0</strong></div><div class="d-flex gap-2 mt-3"><a class="btn btn-sm btn-outline-dark rounded-pill" th:href="@{/orders/{id}(id=${order.id})}">View order</a><a th:if="${(order.status.name() == 'PENDING' || order.status.name() == 'CONFIRMED') && order.paymentStatus?.name() != 'SUCCESS'}" class="btn btn-sm btn-dark rounded-pill" th:href="@{/orders/{id}/payment(id=${order.id})}">Pay now</a></div></div></div></div></main></body></html>
