<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Orders — Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#f7f7f4;color:#172033;font-family:Inter,system-ui,sans-serif}
        .navbar{background:#fff;border-bottom:1px solid #ecebe7}
        .brand{font-weight:800;letter-spacing:-.04em}
        .order-card{border:1px solid #e8e6e1;border-radius:20px;background:#fff;transition:transform .18s ease,box-shadow .18s ease}
        .order-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(23,32,51,.08)!important}
        .muted{color:#6b7280}
        .status{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .7rem;border-radius:999px;font-size:.78rem;font-weight:700}
        .status-pending{background:#fff3cd;color:#8a6500}
        .status-confirmed{background:#cff4fc;color:#055160}
        .status-shipped{background:#e2d9f3;color:#4b2c77}
        .status-delivered{background:#d1e7dd;color:#0f5132}
        .status-cancelled{background:#f8d7da;color:#842029}
    </style>
</head>
<body>
<nav class="navbar">
    <div class="container py-3 d-flex justify-content-between align-items-center gap-3">
        <a class="navbar-brand brand" href="/">BOOKSTORE<span style="color:#e07a5f">.</span></a>
        <a href="/books" class="btn btn-sm btn-dark rounded-pill"><i class="bi bi-bag me-1"></i>Continue shopping</a>
    </div>
</nav>

<main class="container py-5">
    <div class="mb-4">
        <div class="text-secondary text-uppercase small fw-bold">Your account</div>
        <h1 class="fw-bold mb-1">My orders</h1>
        <p class="muted mb-0">Track your purchases and manage payments.</p>
    </div>

    <div th:if="${orders.empty}" class="text-center py-5">
        <div class="mb-3" aria-hidden="true"><i class="bi bi-bag-x fs-1 muted"></i></div>
        <h4 class="fw-bold">No orders yet</h4>
        <p class="muted">Your next great read is waiting.</p>
        <a href="/books" class="btn btn-dark rounded-pill"><i class="bi bi-search me-1"></i>Browse books</a>
    </div>

    <div th:unless="${orders.empty}" class="row g-3">
        <div class="col-12" th:each="order : ${orders}">
            <div class="order-card shadow-sm p-4">
                <div class="d-flex justify-content-between flex-wrap gap-3">
                    <div>
                        <div class="fw-bold fs-5" th:text="${'Order #' + order.id}">Order #1</div>
                        <div class="muted small" th:text="${#temporals.format(order.orderDate,'dd MMM yyyy, HH:mm')}">Date</div>
                    </div>
                    <div class="text-end">
                        <span class="status"
                              th:classappend="${order.status.name() == 'PENDING' ? ' status-pending' : (order.status.name() == 'CONFIRMED' ? ' status-confirmed' : (order.status.name() == 'SHIPPED' ? ' status-shipped' : (order.status.name() == 'DELIVERED' ? ' status-delivered' : ' status-cancelled')))}"
                              th:text="${order.status}">PENDING</span>
                        <div class="small muted mt-1" th:if="${order.paymentStatus}" th:text="${'Payment: ' + order.paymentStatus}">Payment: CREATED</div>
                    </div>
                </div>

                <div class="border-top mt-3 pt-3 d-flex justify-content-between align-items-center gap-3">
                    <span class="muted" th:text="${order.items.size() + (order.items.size() == 1 ? ' item' : ' items')}">1 item</span>
                    <strong class="fs-5" th:text="${'₹' + order.totalAmount}">₹0</strong>
                </div>

                <div class="d-flex flex-wrap gap-2 mt-3">
                    <a class="btn btn-sm btn-outline-dark rounded-pill" th:href="@{/orders/{id}(id=${order.id})}"><i class="bi bi-eye me-1"></i>View order</a>
                    <a th:if="${(order.status.name() == 'PENDING' || order.status.name() == 'CONFIRMED') && order.paymentStatus?.name() != 'SUCCESS'}" class="btn btn-sm btn-dark rounded-pill" th:href="@{/orders/{id}/payment(id=${order.id})}"><i class="bi bi-credit-card me-1"></i>Pay now</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
