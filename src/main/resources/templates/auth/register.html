<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create account — Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: #f7f7f4; color: #172033; }
        .box { max-width: 520px; margin: 6vh auto; background: #fff; border: 1px solid #e8e6e1; border-radius: 24px; padding: 36px; }
        .accent { background: #e07a5f; color: #fff; border: 0; }
        .accent:hover { background: #cf6c53; color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <div class="box">
        <a href="/" class="text-decoration-none fw-bold text-dark">BOOKSTORE<span style="color:#e07a5f">.</span></a>
        <h1 class="h3 fw-bold mt-4">Create your account</h1>
        <p class="text-secondary">Join the bookstore to manage your cart and orders.</p>

        <div class="alert alert-danger" th:if="${registrationError}" th:text="${registrationError}"></div>

        <form method="post" action="/auth/register" th:object="${registerRequest}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-3">
                <label class="form-label" for="name">Full name</label>
                <input id="name" class="form-control" type="text" th:field="*{name}" required autocomplete="name">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input id="email" class="form-control" type="email" th:field="*{email}" required autocomplete="email">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input id="password" class="form-control" type="password" th:field="*{password}" required minlength="8" autocomplete="new-password">
                <div class="form-text">Use at least 8 characters.</div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-5">
                    <label class="form-label" for="phone">Phone <span class="text-secondary">(optional)</span></label>
                    <input id="phone" class="form-control" type="text" th:field="*{phone}" autocomplete="tel">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
                <div class="col-md-7">
                    <label class="form-label" for="address">Address <span class="text-secondary">(optional)</span></label>
                    <input id="address" class="form-control" type="text" th:field="*{address}" autocomplete="street-address">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>
            </div>

            <button class="btn accent w-100 rounded-pill" type="submit">Create account</button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
            Already have an account?
            <a href="/auth/login">Sign in</a>
        </p>
        <a href="/books" class="d-block text-center mt-3 text-secondary">Continue browsing</a>
    </div>
</div>
</body>
</html>
