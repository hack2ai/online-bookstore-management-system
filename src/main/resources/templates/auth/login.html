<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in — Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: #f7f7f4; color: #172033; }
        .box { max-width: 430px; margin: 10vh auto; background: #fff; border: 1px solid #e8e6e1; border-radius: 24px; padding: 36px; }
        .accent { background: #e07a5f; color: #fff; border: 0; }
        .accent:hover { background: #cf6c53; color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <div class="box">
        <a href="/" class="text-decoration-none fw-bold text-dark">BOOKSTORE<span style="color:#e07a5f">.</span></a>
        <h1 class="h3 fw-bold mt-4">Welcome back</h1>
        <p class="text-secondary">Sign in to manage your cart and orders.</p>

        <div class="alert alert-danger" th:if="${param.error}">Invalid email or password.</div>
        <div class="alert alert-success" th:if="${param.logout}">You've been signed out.</div>
        <div class="alert alert-success" th:if="${param.registered}">Account created successfully. You can sign in now.</div>

        <form method="post" action="/auth/login">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label class="form-label" for="username">Email</label>
                <input id="username" class="form-control" type="email" name="username" required autocomplete="email">
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input id="password" class="form-control" type="password" name="password" required autocomplete="current-password">
            </div>
            <button class="btn accent w-100 rounded-pill" type="submit">Sign in</button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
            New to Bookstore?
            <a href="/auth/register">Create an account</a>
        </p>
        <a href="/books" class="d-block text-center mt-3 text-secondary">Continue browsing</a>
    </div>
</div>
</body>
</html>
