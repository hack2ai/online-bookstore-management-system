<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart — Bookstore</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f7f7f4;color:#172033;font-family:Inter,system-ui,sans-serif}.navbar{background:#fff;border-bottom:1px solid #ecebe7}.brand{font-weight:800}.cardx{background:#fff;border:1px solid #e8e6e1;border-radius:18px}.accent{background:#e07a5f;color:#fff;border:0}.price{font-weight:800}</style></head><body><nav class="navbar"><div class="container py-3"><a class="navbar-brand brand" href="/">BOOKSTORE<span style="color:#e07a5f">.</span></a><a class="btn btn-outline-dark rounded-pill btn-sm" href="/books">Continue shopping</a></div></nav><main class="container py-5"><div class="d-flex justify-content-between align-items-end mb-4"><div><div class="text-secondary small text-uppercase fw-bold">Shopping bag</div><h1 class="fw-bold">Your cart</h1></div><span class="text-secondary" th:text="${cart.itemCount + ' items'}">0 items</span></div><div class="row g-4" th:if="${!cart.items.empty}"><div class="col-lg-8"><div class="cardx p-3 p-lg-4"><div class="d-flex flex-column gap-3"><div class="border-bottom pb-3" th:each="item : ${cart.items}"><div class="d-flex justify-content-between gap-3"><div><h5 class="mb-1" th:text="${item.title}">Book</h5><div class="text-secondary small" th:text="${item.author}">Author</div><div class="small mt-2" th:text="${'₹' + item.unitPrice + ' × ' + item.quantity}">₹0 × 1</div></div><div class="text-end"><div class="price" th:text="${'₹' + item.subtotal}">₹0</div><form th:action="@{'/cart/items/' + ${item.bookId} + '/remove'}" method="post" class="mt-2"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger rounded-pill">Remove</button></form></div></div></div></div></div></div><div class="col-lg-4"><div class="cardx p-4"><h5 class="fw-bold">Summary</h5><div class="d-flex justify-content-between mt-4"><span>Subtotal</span><strong th:text="${'₹' + cart.subtotal}">₹0</strong></div><hr><div class="d-flex justify-content-between"><strong>Total</strong><strong th:text="${'₹' + cart.subtotal}">₹0</strong></div><a href="/checkout" class="btn accent w-100 rounded-pill mt-4">Proceed to checkout</a><form action="/cart/clear" method="post" class="mt-2"><input type="hidden" name="_csrf" th:value="${_csrf.token}"><button class="btn btn-link text-secondary w-100">Clear cart</button></form></div></div></div><div class="cardx text-center p-5" th:if="${cart.items.empty}"><h3>Your cart is empty</h3><p class="text-secondary">Find something you'll love to read.</p><a href="/books" class="btn accent rounded-pill px-4">Browse books</a></div></main></body></html>
