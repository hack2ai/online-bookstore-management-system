<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order confirmed — Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{min-height:100vh;background:#f7f7f4;color:#172033;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center}
        .success-card{width:100%;max-width:680px;background:#fff;border:1px solid #e8e6e1;border-radius:24px;box-shadow:0 14px 40px rgba(23,32,51,.08)}
        .success-icon{width:76px;height:76px;border-radius:24px;background:#d1e7dd;color:#0f5132;display:flex;align-items:center;justify-content:center;font-size:2.4rem;margin:0 auto}
        .order-ref{display:inline-block;background:#f2eee9;border-radius:999px;padding:.5rem .9rem;font-weight:700}
    </style>
</head>
<body>
<main class="container py-5">
    <div class="success-card mx-auto p-4 p-md-5 text-center">
        <div class="success-icon mb-4" aria-hidden="true"><i class="bi bi-check2-circle"></i></div>
        <div class="text-secondary small text-uppercase fw-bold">Checkout complete</div>
        <h1 class="display-6 fw-bold mt-2">Order placed</h1>
        <p class="text-secondary fs-5">Your order has been created successfully.</p>
        <div th:if="${order}" class="order-ref mt-2" th:text="${'Order #' + order.id}">Order #1</div>

        <div th:if="${order}" class="alert alert-warning text-start mt-4 mb-0 d-flex align-items-start gap-2" role="alert">
            <i class="bi bi-credit-card fs-5"></i>
            <div><strong>Payment pending.</strong><div>Complete payment to confirm your order and finish checkout.</div></div>
        </div>

        <div class="d-flex justify-content-center gap-2 mt-4 flex-wrap">
            <a th:if="${order}" th:href="@{'/orders/' + ${order.id} + '/payment'}" class="btn btn-dark rounded-pill px-4"><i class="bi bi-credit-card me-1"></i>Pay now</a>
            <a th:if="${order}" th:href="@{'/orders/' + ${order.id}}" class="btn btn-outline-dark rounded-pill px-4"><i class="bi bi-receipt me-1"></i>View order</a>
            <a href="/orders" class="btn btn-outline-secondary rounded-pill px-4"><i class="bi bi-bag-check me-1"></i>My orders</a>
            <a href="/books" class="btn btn-outline-dark rounded-pill px-4"><i class="bi bi-book me-1"></i>Continue shopping</a>
        </div>
    </div>
</main>
</body>
</html>
