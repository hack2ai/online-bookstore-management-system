<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order confirmed — Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f7f7f4;color:#172033">
<main class="container py-5">
    <div class="card border-0 rounded-4 p-5 text-center mx-auto" style="max-width:650px">
        <div class="display-3 mb-3">✓</div>
        <h1 class="fw-bold">Order placed</h1>
        <p class="text-secondary">Your order has been created successfully.</p>
        <p th:if="${order}" class="fw-semibold" th:text="${'Order #' + order.id}">Order #1</p>

        <div th:if="${order}" class="alert alert-warning text-start mt-4 mb-0">
            <strong>Payment pending.</strong>
            Complete payment to confirm your order and finish checkout.
        </div>

        <div class="d-flex justify-content-center gap-2 mt-4 flex-wrap">
            <a th:if="${order}" th:href="@{'/orders/' + ${order.id} + '/payment'}"
               class="btn btn-dark rounded-pill px-4">Pay now</a>
            <a th:if="${order}" th:href="@{'/orders/' + ${order.id}}"
               class="btn btn-outline-dark rounded-pill px-4">View order</a>
            <a href="/orders" class="btn btn-outline-secondary rounded-pill px-4">My orders</a>
            <a href="/books" class="btn btn-outline-dark rounded-pill px-4">Continue shopping</a>
        </div>
    </div>
</main>
</body>
</html>
