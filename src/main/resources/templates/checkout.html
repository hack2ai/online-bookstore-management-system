<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Bookstore</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f7f7f4;color:#172033;font-family:Inter,system-ui,sans-serif}.panel{background:#fff;border:1px solid #e8e6e1;border-radius:22px}.accent{background:#e07a5f;color:#fff;border:0}.accent:hover{background:#ca654d;color:#fff}.price{font-weight:800}</style></head>
<body><nav class="navbar bg-white border-bottom"><div class="container py-3"><a class="navbar-brand fw-bold" href="/">BOOKSTORE<span style="color:#e07a5f">.</span></a><a href="/cart" class="btn btn-sm btn-outline-dark rounded-pill">Back to cart</a></div></nav>
<main class="container py-5"><div class="row g-4"><div class="col-lg-7"><div class="panel p-4 p-lg-5"><h1 class="fw-bold mb-1">Checkout</h1><p class="text-secondary mb-4">Where should we deliver your books?</p><form method="post" action="/checkout"><label class="form-label fw-semibold">Shipping address</label><textarea name="shippingAddress" class="form-control" rows="5" maxlength="500" required placeholder="House number, street, city, state, PIN code"></textarea><button class="btn accent rounded-pill px-4 mt-4" type="submit">Place order</button></form></div></div><div class="col-lg-5"><div class="panel p-4"><h5 class="fw-bold">Order summary</h5><div th:each="item : ${cart.items}" class="d-flex justify-content-between py-3 border-bottom"><div><div class="fw-semibold" th:text="${item.title}">Book</div><small class="text-secondary" th:text="${'Qty ' + item.quantity}">Qty 1</small></div><span class="price" th:text="${'₹' + item.subtotal}">₹0</span></div><div class="d-flex justify-content-between pt-3"><strong>Total</strong><strong class="price" th:text="${'₹' + cart.subtotal}">₹0</strong></div></div></div></div></main></body></html>
