<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Orders — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f5f6f8;color:#172033">
<nav class="navbar bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin">BOOKSTORE ADMIN</a>
        <a href="/" class="btn btn-sm btn-outline-light rounded-pill">Storefront</a>
    </div>
</nav>
<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <div class="text-secondary small text-uppercase fw-bold">Operations</div>
            <h1 class="fw-bold mb-0">Orders</h1>
        </div>
        <a href="/admin" class="btn btn-dark rounded-pill">Dashboard</a>
    </div>

    <form method="get" class="card border-0 shadow-sm rounded-4 p-3 mb-4">
        <div class="row align-items-end g-2">
            <div class="col-md-4">
                <label class="form-label small fw-semibold">Filter by status</label>
                <select class="form-select" name="status">
                    <option value="">All orders</option>
                    <option th:each="status : ${statuses}"
                            th:value="${status}"
                            th:text="${status}"
                            th:selected="${status == selectedStatus}">PENDING</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-dark w-100" type="submit">Apply</button>
            </div>
        </div>
    </form>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>Order</th>
                    <th>Date</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th class="text-end">Update</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders.content}">
                    <td class="fw-semibold" th:text="${'#' + order.id}">#1</td>
                    <td th:text="${order.orderDate}">Date</td>
                    <td th:text="${order.items.size()}">1</td>
                    <td th:text="${'₹' + order.totalAmount}">₹0</td>
                    <td>
                        <span class="badge text-bg-light" th:text="${order.status}">PENDING</span>
                    </td>
                    <td>
                        <form method="post"
                              th:action="@{/admin/orders/{id}/status(id=${order.id})}"
                              class="d-flex justify-content-end gap-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <select class="form-select form-select-sm" name="status" style="max-width:160px">
                                <option th:each="status : ${statuses}"
                                        th:value="${status}"
                                        th:text="${status}"
                                        th:selected="${status == order.status}">PENDING</option>
                            </select>
                            <button class="btn btn-sm btn-dark rounded-pill" type="submit">Save</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${orders.content.empty}">
                    <td colspan="6" class="text-center text-secondary py-5">No orders found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-4" th:if="${orders.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${orders.first ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/admin/orders(page=${orders.number-1},status=${selectedStatus})}">Previous</a>
            </li>
            <li class="page-item disabled"><span class="page-link" th:text="${'Page ' + (orders.number+1) + ' of ' + orders.totalPages}">Page</span></li>
            <li class="page-item" th:classappend="${orders.last ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/admin/orders(page=${orders.number+1},status=${selectedStatus})}">Next</a>
            </li>
        </ul>
    </nav>
</main>
</body>
</html>
