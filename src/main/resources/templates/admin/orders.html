<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orders — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#f5f6f8;color:#172033}
        .page-card{border:0;border-radius:20px;box-shadow:0 4px 20px rgba(23,32,51,.06)}
        .order-id{font-weight:800;letter-spacing:-.02em}
        .status{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .7rem;border-radius:999px;font-size:.78rem;font-weight:700}
        .status-pending{background:#fff3cd;color:#8a6500}
        .status-confirmed{background:#cff4fc;color:#055160}
        .status-shipped{background:#e2d9f3;color:#4b2c77}
        .status-delivered{background:#d1e7dd;color:#0f5132}
        .status-cancelled{background:#f8d7da;color:#842029}
        .table thead th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;white-space:nowrap}
    </style>
</head>
<body>
<nav class="navbar bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin"><i class="bi bi-book me-2"></i>BOOKSTORE ADMIN</a>
        <a href="/" class="btn btn-sm btn-outline-light rounded-pill">Storefront</a>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <div class="text-secondary small text-uppercase fw-bold">Operations</div>
            <h1 class="fw-bold mb-1">Orders</h1>
            <p class="text-secondary mb-0">Review orders, track progress, and update fulfilment status.</p>
        </div>
        <a href="/admin" class="btn btn-dark rounded-pill"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
    </div>

    <div class="card page-card p-3 mb-4">
        <form method="get">
            <div class="row align-items-end g-3">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold" for="statusFilter">Filter by status</label>
                    <select id="statusFilter" class="form-select" name="status">
                        <option value="">All orders</option>
                        <option th:each="status : ${statuses}"
                                th:value="${status}"
                                th:text="${status}"
                                th:selected="${status == selectedStatus}">PENDING</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-dark w-100" type="submit"><i class="bi bi-funnel me-1"></i>Apply</button>
                </div>
            </div>
        </form>
    </div>

    <div class="card page-card overflow-hidden">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>Order</th>
                    <th>Date</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders.content}">
                    <td class="order-id" th:text="${'#' + order.id}">#1</td>
                    <td th:text="${#temporals.format(order.orderDate,'dd MMM yyyy, HH:mm')}">21 Aug 2026, 14:30</td>
                    <td>
                        <span th:text="${order.items.size()}">1</span>
                        <span class="text-secondary" th:text="${order.items.size() == 1 ? ' item' : ' items'}"> items</span>
                    </td>
                    <td class="fw-semibold" th:text="${'₹' + order.totalAmount}">₹0</td>
                    <td>
                        <span class="status"
                              th:classappend="${order.status.name() == 'PENDING' ? ' status-pending' : (order.status.name() == 'CONFIRMED' ? ' status-confirmed' : (order.status.name() == 'SHIPPED' ? ' status-shipped' : (order.status.name() == 'DELIVERED' ? ' status-delivered' : ' status-cancelled')))}"
                              th:text="${order.status}">PENDING</span>
                    </td>
                    <td>
                        <div class="d-flex justify-content-end gap-2 flex-wrap">
                            <a class="btn btn-sm btn-outline-dark rounded-pill" th:href="@{/admin/orders/{id}(id=${order.id})}"><i class="bi bi-eye me-1"></i>View</a>
                            <form method="post" th:action="@{/admin/orders/{id}/status(id=${order.id})}" class="d-flex gap-2">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <label class="visually-hidden" th:for="${'status-' + order.id}">Update status for order [[${order.id}]]</label>
                                <select class="form-select form-select-sm" th:id="${'status-' + order.id}" name="status" style="max-width:155px" aria-label="Order status">
                                    <option th:each="status : ${statuses}"
                                            th:value="${status}"
                                            th:text="${status}"
                                            th:selected="${status == order.status}">PENDING</option>
                                </select>
                                <button class="btn btn-sm btn-dark rounded-pill" type="submit">Save</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${orders.content.empty}">
                    <td colspan="6" class="text-center text-secondary py-5">
                        <i class="bi bi-inbox d-block fs-2 mb-2"></i>
                        No orders found for this filter.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-4" aria-label="Orders pagination" th:if="${orders.totalPages > 1}">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${orders.first ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/admin/orders(page=${orders.number-1},status=${selectedStatus})}">Previous</a>
            </li>
            <li class="page-item disabled"><span class="page-link" th:text="${'Page ' + (orders.number+1) + ' of ' + orders.totalPages}">Page</span></li>
            <li class="page-item" th:classappend="${orders.last ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/admin/orders(page=${orders.number+1},status=${selectedStatus})}">Next</a>
            </li>
        </ul>
    </nav>
</main>
</body>
</html>
