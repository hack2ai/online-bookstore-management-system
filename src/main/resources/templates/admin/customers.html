<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers — Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body style="background:#f5f6f8;color:#172033"><nav class="navbar bg-dark navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="/admin">BOOKSTORE ADMIN</a><a href="/" class="btn btn-sm btn-outline-light rounded-pill">Storefront</a></div></nav><main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><div class="text-secondary small text-uppercase fw-bold">Management</div><h1 class="fw-bold mb-0">Customers</h1></div><a href="/admin" class="btn btn-dark rounded-pill">Dashboard</a></div><form method="get" class="card border-0 shadow-sm rounded-4 p-3 mb-4"><div class="row g-2"><div class="col-md-9"><input name="keyword" th:value="${keyword}" class="form-control" placeholder="Search customer name or email"></div><div class="col-md-3"><button class="btn btn-dark w-100">Search</button></div></div></form><div class="card border-0 shadow-sm rounded-4 overflow-hidden"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Customer</th><th>Phone</th><th>Joined</th><th>Orders</th><th>Total spent</th></tr></thead><tbody><tr th:each="customer : ${customers.content}"><td><div class="fw-semibold" th:text="${customer.name}">Name</div><small class="text-secondary" th:text="${customer.email}">email</small></td><td th:text="${customer.phone ?: '—'}">—</td><td th:text="${customer.createdAt}">Date</td><td th:text="${customer.orderCount}">0</td><td class="fw-semibold" th:text="${'₹' + customer.totalSpent}">₹0</td></tr></tbody></table></div></div><nav class="mt-4" th:if="${customers.totalPages > 1}"><ul class="pagination"><li class="page-item" th:classappend="${customers.first ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/customers(page=${customers.number-1},keyword=${keyword})}">Previous</a></li><li class="page-item disabled"><span class="page-link" th:text="${'Page ' + (customers.number+1) + ' of ' + customers.totalPages}">Page</span></li><li class="page-item" th:classappend="${customers.last ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/customers(page=${customers.number+1},keyword=${keyword})}">Next</a></li></ul></nav></main></body></html>
