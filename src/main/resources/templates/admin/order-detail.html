<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${'Order #' + order.id + ' — Admin'}">Order — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#f5f6f8;color:#172033}
        .panel{background:#fff;border:0;border-radius:20px;box-shadow:0 4px 20px rgba(23,32,51,.06)}
        .muted{color:#6b7280}
        .status{display:inline-flex;align-items:center;gap:.35rem;padding:.45rem .75rem;border-radius:999px;font-size:.8rem;font-weight:700}
        .status-pending{background:#fff3cd;color:#8a6500}
        .status-confirmed{background:#cff4fc;color:#055160}
        .status-shipped{background:#e2d9f3;color:#4b2c77}
        .status-delivered{background:#d1e7dd;color:#0f5132}
        .status-cancelled{background:#f8d7da;color:#842029}
    </style>
</head>
<body>
<nav class="navbar bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin"><i class="bi bi-book me-2"></i>BOOKSTORE ADMIN</a>
        <a href="/admin/orders" class="btn btn-sm btn-outline-light rounded-pill"><i class="bi bi-arrow-left me-1"></i>Back to orders</a>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-3 mb-4">
        <div>
            <div class="text-uppercase small fw-bold muted">Order details</div>
            <h1 class="fw-bold mb-1" th:text="${'Order #' + order.id}">Order #1</h1>
            <div class="muted" th:text="${#temporals.format(order.orderDate,'dd MMM yyyy, HH:mm')}">Date</div>
        </div>
        <span class="status"
              th:classappend="${order.status.name() == 'PENDING' ? ' status-pending' : (order.status.name() == 'CONFIRMED' ? ' status-confirmed' : (order.status.name() == 'SHIPPED' ? ' status-shipped' : (order.status.name() == 'DELIVERED' ? ' status-delivered' : ' status-cancelled')))}"
              th:text="${order.status}">PENDING</span>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="panel p-4 mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold mb-0">Items</h4>
                    <span class="text-secondary small" th:text="${order.items.size() + (order.items.size() == 1 ? ' item' : ' items')}">1 item</span>
                </div>
                <div class="border-bottom py-3" th:each="item : ${order.items}">
                    <div class="d-flex justify-content-between gap-3">
                        <div>
                            <div class="fw-semibold" th:text="${item.title}">Book</div>
                            <div class="muted small" th:text="${'₹' + item.unitPrice + ' × ' + item.quantity}">₹0 × 1</div>
                        </div>
                        <div class="fw-semibold text-nowrap" th:text="${'₹' + item.subtotal}">₹0</div>
                    </div>
                </div>
            </div>

            <div class="panel p-4">
                <h4 class="fw-bold mb-3"><i class="bi bi-geo-alt me-2"></i>Shipping</h4>
                <div class="muted small mb-1">Delivery address</div>
                <div class="lh-lg" th:text="${order.shippingAddress}">Address</div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="panel p-4 mb-4">
                <h4 class="fw-bold mb-3">Summary</h4>
                <div class="d-flex justify-content-between mb-2"><span>Subtotal</span><strong th:text="${'₹' + order.subtotalAmount}">₹0</strong></div>
                <div class="d-flex justify-content-between mb-2"><span>Discount</span><strong th:text="${'₹' + order.discountAmount}">₹0</strong></div>
                <div class="d-flex justify-content-between border-top pt-3 mt-3"><span class="fw-bold">Total</span><strong class="fs-5" th:text="${'₹' + order.totalAmount}">₹0</strong></div>
            </div>

            <div class="panel p-4 mb-4">
                <h4 class="fw-bold mb-3"><i class="bi bi-credit-card me-2"></i>Payment</h4>
                <div class="d-flex justify-content-between"><span>Status</span><strong th:text="${order.paymentStatus ?: 'NOT PAID'}">NOT PAID</strong></div>
            </div>

            <div class="panel p-4">
                <h4 class="fw-bold mb-3">Update status</h4>
                <form method="post" th:action="@{/admin/orders/{id}/status(id=${order.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <label class="visually-hidden" for="orderStatus">Order status</label>
                    <select id="orderStatus" class="form-select mb-3" name="status">
                        <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == order.status}">PENDING</option>
                    </select>
                    <button class="btn btn-dark w-100 rounded-pill" type="submit"><i class="bi bi-check2-circle me-1"></i>Save status</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
