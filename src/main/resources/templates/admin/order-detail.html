<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${'Order #' + order.id + ' — Admin'}">Order — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f5f6f8;color:#172033}.panel{background:#fff;border:0;border-radius:20px}.muted{color:#6b7280}</style>
</head>
<body>
<nav class="navbar bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin">BOOKSTORE ADMIN</a>
        <a href="/admin/orders" class="btn btn-sm btn-outline-light rounded-pill">Back to orders</a>
    </div>
</nav>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
        <div><div class="text-uppercase small fw-bold muted">Order details</div><h1 class="fw-bold mb-1" th:text="${'Order #' + order.id}">Order #1</h1><div class="muted" th:text="${order.orderDate}">Date</div></div>
        <span class="badge text-bg-light p-2" th:text="${order.status}">PENDING</span>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="panel shadow-sm p-4 mb-4">
                <h4 class="fw-bold mb-3">Items</h4>
                <div class="border-bottom py-3" th:each="item : ${order.items}">
                    <div class="d-flex justify-content-between gap-3"><div><div class="fw-semibold" th:text="${item.title}">Book</div><div class="muted small" th:text="${'₹' + item.unitPrice + ' × ' + item.quantity}">₹0 × 1</div></div><div class="fw-semibold" th:text="${'₹' + item.subtotal}">₹0</div></div>
                </div>
            </div>

            <div class="panel shadow-sm p-4">
                <h4 class="fw-bold mb-3">Shipping</h4>
                <div class="muted small mb-1">Delivery address</div>
                <div th:text="${order.shippingAddress}">Address</div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="panel shadow-sm p-4 mb-4">
                <h4 class="fw-bold mb-3">Summary</h4>
                <div class="d-flex justify-content-between mb-2"><span>Subtotal</span><strong th:text="${'₹' + order.subtotalAmount}">₹0</strong></div>
                <div class="d-flex justify-content-between mb-2"><span>Discount</span><strong th:text="${'₹' + order.discountAmount}">₹0</strong></div>
                <div class="d-flex justify-content-between border-top pt-3 mt-3"><span class="fw-bold">Total</span><strong class="fs-5" th:text="${'₹' + order.totalAmount}">₹0</strong></div>
            </div>

            <div class="panel shadow-sm p-4 mb-4">
                <h4 class="fw-bold mb-3">Payment</h4>
                <div class="d-flex justify-content-between"><span>Status</span><strong th:text="${order.paymentStatus ?: 'NOT PAID'}">NOT PAID</strong></div>
            </div>

            <div class="panel shadow-sm p-4">
                <h4 class="fw-bold mb-3">Update status</h4>
                <form method="post" th:action="@{/admin/orders/{id}/status(id=${order.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <select class="form-select mb-3" name="status">
                        <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == order.status}">PENDING</option>
                    </select>
                    <button class="btn btn-dark w-100 rounded-pill" type="submit">Save status</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
