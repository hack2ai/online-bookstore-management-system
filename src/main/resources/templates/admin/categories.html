<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Categories — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f5f6f8;color:#172033">
<nav class="navbar bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin">BOOKSTORE ADMIN</a>
        <a href="/" class="btn btn-sm btn-outline-light rounded-pill">Storefront</a>
    </div>
</nav>
<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <div class="text-secondary small text-uppercase fw-bold">Catalog</div>
            <h1 class="fw-bold mb-0">Categories</h1>
        </div>
        <a href="/admin" class="btn btn-outline-dark rounded-pill">Dashboard</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
        <h5 class="fw-bold mb-3">Add category</h5>
        <form method="post" action="/admin/categories" th:object="${categoryRequest}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Name</label>
                    <input class="form-control" th:field="*{categoryName}" maxlength="100" required>
                    <div class="text-danger small mt-1" th:errors="*{categoryName}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Description</label>
                    <input class="form-control" th:field="*{description}" maxlength="500">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-dark w-100" type="submit">Add</button>
                </div>
            </div>
        </form>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Books</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td>
                        <form method="post" th:action="@{'/admin/categories/' + ${category.id}}" class="row g-2 align-items-center">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="col-lg-8">
                                <input name="categoryName" class="form-control fw-semibold" maxlength="100" required th:value="${category.categoryName}">
                            </div>
                            <div class="col-lg-4 d-lg-none">
                                <button class="btn btn-sm btn-dark" type="submit">Save</button>
                            </div>
                        </form>
                    </td>
                    <td>
                        <form method="post" th:action="@{'/admin/categories/' + ${category.id}}" class="d-flex gap-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input name="categoryName" type="hidden" th:value="${category.categoryName}">
                            <input name="description" class="form-control" maxlength="500" th:value="${category.description}">
                            <button class="btn btn-sm btn-dark rounded-pill" type="submit">Save</button>
                        </form>
                    </td>
                    <td th:text="${category.bookCount}">0</td>
                    <td class="text-end">
                        <form method="post" th:action="@{'/admin/categories/' + ${category.id} + '/delete'}" onsubmit="return confirm('Delete this category? Only unused categories can be deleted.');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-danger rounded-pill" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(categories)}">
                    <td colspan="4" class="text-center text-secondary py-5">No categories found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
