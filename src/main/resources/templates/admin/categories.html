<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categories — Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body style="background:#f5f6f8;color:#172033"><nav class="navbar bg-dark navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="/admin">BOOKSTORE ADMIN</a><a href="/" class="btn btn-sm btn-outline-light rounded-pill">Storefront</a></div></nav><main class="container py-5"><div class="d-flex justify-content-between mb-4"><h1 class="fw-bold">Categories</h1><a href="/admin" class="btn btn-dark rounded-pill">Dashboard</a></div><div class="card border-0 shadow-sm rounded-4 overflow-hidden"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Name</th><th>Description</th><th>Books</th></tr></thead><tbody><tr th:each="category : ${categories}"><td class="fw-semibold" th:text="${category.categoryName}">Category</td><td th:text="${category.description ?: '—'}">Description</td><td th:text="${category.bookCount}">0</td></tr></tbody></table></div></div></main></body></html>
