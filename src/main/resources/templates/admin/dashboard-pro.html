<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard — Bookstore</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><style>body{background:#f5f6f8;color:#172033}.metric{border:0;border-radius:20px;box-shadow:0 8px 25px rgba(23,32,51,.06)}.value{font-size:2rem;font-weight:800;letter-spacing:-.04em}.muted{color:#6b7280}.quick a{min-width:150px}</style></head><body><nav class="navbar bg-dark navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="/admin">BOOKSTORE ADMIN</a><a href="/" class="btn btn-sm btn-outline-light rounded-pill">Storefront</a></div></nav><main class="container py-5"><div class="d-flex justify-content-between align-items-end mb-4"><div><div class="muted small text-uppercase fw-bold">Operations</div><h1 class="fw-bold mb-0">Dashboard</h1></div><span class="badge rounded-pill text-bg-light">Live database metrics</span></div><div class="row g-3"><div class="col-sm-6 col-xl-3"><div class="card metric p-4"><div class="muted">Revenue</div><div class="value" th:text="${'₹' + paidRevenue}">₹0</div></div></div><div class="col-sm-6 col-xl-3"><div class="card metric p-4"><div class="muted">Orders</div><div class="value" th:text="${orderCount}">0</div><small class="muted" th:text="${pendingOrders + ' pending'}">0 pending</small></div></div><div class="col-sm-6 col-xl-3"><div class="card metric p-4"><div class="muted">Customers</div><div class="value" th:text="${customerCount}">0</div></div></div><div class="col-sm-6 col-xl-3"><div class="card metric p-4"><div class="muted">Low stock</div><div class="value" th:text="${lowStockBooks}">0</div></div></div></div><div class="card metric p-4 mt-4"><h5 class="fw-bold">Catalog</h5><div class="d-flex flex-wrap gap-2 quick mt-3"><a href="/admin/books" class="btn btn-dark rounded-pill"><i class="bi bi-book me-1"></i>Books</a><a href="/admin/inventory" class="btn btn-outline-dark rounded-pill"><i class="bi bi-box-seam me-1"></i>Inventory</a><a href="/admin/categories" class="btn btn-outline-dark rounded-pill"><i class="bi bi-tags me-1"></i>Categories</a><a href="/admin/orders" class="btn btn-outline-dark rounded-pill"><i class="bi bi-receipt me-1"></i>Orders</a><a href="/admin/customers" class="btn btn-outline-dark rounded-pill"><i class="bi bi-people me-1"></i>Customers</a></div></div></main></body></html>
