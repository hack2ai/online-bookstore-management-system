<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard — Bookstore</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"></head><body style="background:#f5f6f8;color:#172033"><nav class="navbar bg-dark navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="/admin">BOOKSTORE ADMIN</a><div class="d-flex gap-2"><a href="/" class="btn btn-sm btn-outline-light rounded-pill">Storefront</a><form method="post" action="/auth/logout" class="d-inline"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="btn btn-sm btn-light rounded-pill">Logout</button></form></div></div></nav><main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="text-secondary text-uppercase small fw-bold mb-1">Overview</p><h1 class="fw-bold">Dashboard</h1></div></div><div class="row g-3"><div class="col-md-3"><div class="card border-0 shadow-sm rounded-4 p-4"><i class="bi bi-book fs-3"></i><div class="text-secondary mt-3">Books</div><h2 class="fw-bold" th:text="${bookCount}">0</h2></div></div><div class="col-md-3"><div class="card border-0 shadow-sm rounded-4 p-4"><i class="bi bi-tags fs-3"></i><div class="text-secondary mt-3">Categories</div><h2 class="fw-bold" th:text="${categoryCount}">0</h2></div></div><div class="col-md-3"><div class="card border-0 shadow-sm rounded-4 p-4"><i class="bi bi-receipt fs-3"></i><div class="text-secondary mt-3">Orders</div><h2 class="fw-bold" th:text="${orderCount}">0</h2></div></div><div class="col-md-3"><div class="card border-0 shadow-sm rounded-4 p-4"><i class="bi bi-people fs-3"></i><div class="text-secondary mt-3">Customers</div><h2 class="fw-bold" th:text="${customerCount}">0</h2></div></div></div><div class="card border-0 shadow-sm rounded-4 mt-4 p-4"><h5 class="fw-bold">Management</h5><div class="d-flex flex-wrap gap-2 mt-3"><a href="/admin/books" class="btn btn-dark rounded-pill">Manage books</a><a href="/admin/categories" class="btn btn-outline-dark rounded-pill">Categories</a><a href="/admin/orders" class="btn btn-outline-dark rounded-pill">Orders</a></div></div></main></body></html>
