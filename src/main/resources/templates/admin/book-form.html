<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${bookId == null ? 'Add Book' : 'Edit Book'}">Book</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body style="background:#f5f6f8;color:#172033"><main class="container py-5"><div class="card border-0 shadow-sm rounded-4 p-4 p-lg-5 mx-auto" style="max-width:820px"><div class="d-flex justify-content-between align-items-center mb-4"><h1 class="fw-bold" th:text="${bookId == null ? 'Add book' : 'Edit book'}">Add book</h1><a href="/admin/books" class="btn btn-outline-dark rounded-pill">Back</a></div><form method="post" th:action="${bookId == null ? '/admin/books' : '/admin/books/' + bookId}"><div class="row g-3"><div class="col-md-8"><label class="form-label">Title</label><input name="title" class="form-control" required maxlength="255" th:value="${book?.title}"></div><div class="col-md-4"><label class="form-label">ISBN</label><input name="isbn" class="form-control" required maxlength="20" th:value="${book?.isbn}"></div><div class="col-md-6"><label class="form-label">Author</label><input name="author" class="form-control" required maxlength="150" th:value="${book?.author}"></div><div class="col-md-6"><label class="form-label">Category ID</label><input name="categoryId" type="number" class="form-control" required th:value="${book?.categoryId}"></div><div class="col-md-6"><label class="form-label">Price</label><input name="price" type="number" step="0.01" min="0" class="form-control" required th:value="${book?.price}"></div><div class="col-md-6"><label class="form-label">Stock</label><input name="stock" type="number" min="0" class="form-control" required th:value="${book?.stock}"></div><div class="col-12"><label class="form-label">Image URL</label><input name="imageUrl" class="form-control" maxlength="500" th:value="${book?.imageUrl}"></div><div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="5" maxlength="2000" th:text="${book?.description}"></textarea></div></div><button class="btn btn-dark rounded-pill px-4 mt-4">Save book</button></form></div></main></body></html>
