<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Books — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f5f6f8;color:#172033">
<nav class="navbar bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin">BOOKSTORE ADMIN</a>
        <a href="/" class="btn btn-sm btn-outline-light rounded-pill">Storefront</a>
    </div>
</nav>
<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <h1 class="fw-bold mb-0">Books</h1>
        <div class="d-flex gap-2">
            <a href="/admin" class="btn btn-outline-dark rounded-pill">Dashboard</a>
            <a href="/admin/books/new" class="btn btn-dark rounded-pill">Add book</a>
        </div>
    </div>

    <form class="card border-0 shadow-sm rounded-4 p-3 mb-4" method="get">
        <div class="row g-2">
            <div class="col-md-9">
                <input class="form-control" name="keyword" th:value="${keyword}" placeholder="Search title or author">
            </div>
            <div class="col-md-3">
                <button class="btn btn-dark w-100">Search</button>
            </div>
        </div>
    </form>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>Book</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books.content}">
                    <td class="fw-semibold" th:text="${book.title}">Book</td>
                    <td th:text="${book.author}">Author</td>
                    <td th:text="${book.categoryName}">Category</td>
                    <td th:text="${'₹' + book.price}">₹0</td>
                    <td>
                        <span class="badge"
                              th:classappend="${book.stock <= 5 ? 'text-bg-warning' : 'text-bg-light'}"
                              th:text="${book.stock}">0</span>
                    </td>
                    <td>
                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-sm btn-outline-dark rounded-pill"
                               th:href="@{/books/{id}(id=${book.id})}">View</a>
                            <a class="btn btn-sm btn-dark rounded-pill"
                               th:href="@{/admin/books/{id}/edit(id=${book.id})}">Edit</a>
                            <form method="post"
                                  th:action="@{/admin/books/{id}/delete(id=${book.id})}"
                                  onsubmit="return confirm('Delete this book? This cannot be undone.');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-sm btn-outline-danger rounded-pill" type="submit">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${books.content.empty}">
                    <td colspan="6" class="text-center text-secondary py-5">No books found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
