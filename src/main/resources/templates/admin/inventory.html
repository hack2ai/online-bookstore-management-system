<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Inventory — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f5f6f8;color:#172033">
<nav class="navbar bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin">BOOKSTORE ADMIN</a>
        <a href="/admin" class="btn btn-sm btn-outline-light rounded-pill">Dashboard</a>
    </div>
</nav>
<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
        <div>
            <div class="text-secondary small text-uppercase fw-bold">Operations</div>
            <h1 class="fw-bold mb-0">Inventory</h1>
            <p class="text-secondary mt-2 mb-0">Books are sorted from lowest stock to highest.</p>
        </div>
        <a href="/admin/books" class="btn btn-outline-dark rounded-pill">Manage books</a>
    </div>

    <form method="get" class="card border-0 shadow-sm rounded-4 p-3 mb-4">
        <div class="row align-items-end g-2">
            <div class="col-md-4">
                <label class="form-label small fw-semibold">Low-stock threshold</label>
                <input type="number" name="threshold" min="0" class="form-control" th:value="${threshold}">
            </div>
            <div class="col-md-2">
                <button class="btn btn-dark w-100" type="submit">Apply</button>
            </div>
        </div>
    </form>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>Book</th>
                    <th>ISBN</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th class="text-end">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books.content}">
                    <td class="fw-semibold" th:text="${book.title}">Book</td>
                    <td th:text="${book.isbn}">ISBN</td>
                    <td th:text="${book.categoryName}">Category</td>
                    <td th:text="${'₹' + book.price}">₹0</td>
                    <td>
                        <span class="badge"
                              th:classappend="${book.stock == 0 ? 'text-bg-danger' : (book.stock <= threshold ? 'text-bg-warning' : 'text-bg-light')}"
                              th:text="${book.stock}">0</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-dark rounded-pill"
                           th:href="@{/admin/books/{id}/edit(id=${book.id})}">Restock / edit</a>
                    </td>
                </tr>
                <tr th:if="${books.content.empty}">
                    <td colspan="6" class="text-center text-secondary py-5">No inventory records found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
