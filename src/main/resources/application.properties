# ===================================================================
# Online Bookstore Management System - Main Configuration
# Defaults are development-friendly; override with environment variables
# and activate a production profile for deployment.
# ===================================================================

spring.application.name=online-bookstore-management-system
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# ----------------- MySQL DataSource -----------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookstore_db}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=BookstoreHikariPool

# ----------------- JPA / Hibernate -----------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.open-in-view=false

# ----------------- Flyway -----------------
# Flyway is the source of truth for schema evolution.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.sql.init.mode=never

# ----------------- JWT -----------------
# Override JWT_SECRET in every shared/staging/production environment.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-default-secret-key-change-me-before-deploying-to-any-real-environment-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.issuer=${JWT_ISSUER:online-bookstore-management-system}

# ----------------- Payments -----------------
# PAYMENT_MODE=RAZORPAY for gateway-backed payments.
# PAYMENT_MODE=MOCK provides a deterministic local test flow and never calls a gateway.
payment.mode=${PAYMENT_MODE:RAZORPAY}

# ----------------- Razorpay -----------------
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_PLACEHOLDER_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:PLACEHOLDER_KEY_SECRET}
razorpay.currency=${RAZORPAY_CURRENCY:INR}

# ----------------- Springdoc / Swagger -----------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.default-produces-media-type=application/json

# ----------------- File Upload -----------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads/images}

# ----------------- Thymeleaf -----------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8

# ----------------- Jackson -----------------
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ----------------- Logging -----------------
logging.level.root=INFO
logging.level.com.bookstore=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ----------------- Actuator -----------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ----------------- Security Headers -----------------
# Enable HSTS explicitly in production; keep it off for plain-HTTP local development.
security.headers.hsts-enabled=false
