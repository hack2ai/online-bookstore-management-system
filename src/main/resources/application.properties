# ===================================================================
# Online Bookstore Management System - Main Configuration
# Active profile defaults to 'dev'. Override with --spring.profiles.active=prod
# or an environment variable SPRING_PROFILES_ACTIVE for deployment.
# ===================================================================

spring.application.name=online-bookstore-management-system
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=8080
server.servlet.context-path=/

# ----------------- MySQL DataSource -----------------
# All values below are overridable via environment variables of the same
# uppercase/underscore name (Spring relaxed binding), e.g. DB_PASSWORD=secret.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookstore_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=BookstoreHikariPool

# ----------------- JPA / Hibernate -----------------
# 'validate' is intentional: schema.sql (run by Spring on startup, see below)
# is the single source of truth for the schema. Hibernate should never silently
# alter production tables. Use Flyway/Liquibase for real migrations if this
# project grows past the bundled SQL script.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.open-in-view=false

# Run schema.sql against the configured datasource on startup (idempotent: uses
# CREATE TABLE IF NOT EXISTS). Disable once you introduce a real migration tool.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.continue-on-error=false

# ----------------- JWT -----------------
# jwt.secret MUST be overridden via the JWT_SECRET env var in any real deployment.
# The default below is for local development only and is intentionally long
# (HS256 requires a key >= 256 bits / 32 bytes).
app.jwt.secret=${JWT_SECRET:dev-only-insecure-default-secret-key-change-me-before-deploying-to-any-real-environment-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.issuer=online-bookstore-management-system

# ----------------- Razorpay -----------------
# Test-mode placeholder keys. Get your own at https://dashboard.razorpay.com/app/keys
# and override via RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET env vars (never commit real keys).
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_PLACEHOLDER_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:PLACEHOLDER_KEY_SECRET}
razorpay.currency=INR

# ----------------- Springdoc / Swagger -----------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.default-produces-media-type=application/json

# ----------------- File Upload (book cover images) -----------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads/images}

# ----------------- Thymeleaf -----------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8

# ----------------- Jackson -----------------
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ----------------- Logging -----------------
logging.level.root=INFO
logging.level.com.bookstore=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ----------------- Actuator -----------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
