# Development-only defaults. Never use this profile for shared or production environments.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookstore_db}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

app.jwt.secret=${JWT_SECRET:dev-only-insecure-default-secret-key-change-me-before-deploying-to-any-real-environment-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.issuer=${JWT_ISSUER:online-bookstore-management-system}

payment.mode=${PAYMENT_MODE:RAZORPAY}
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_PLACEHOLDER_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:PLACEHOLDER_KEY_SECRET}
razorpay.currency=${RAZORPAY_CURRENCY:INR}

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
security.headers.hsts-enabled=false
